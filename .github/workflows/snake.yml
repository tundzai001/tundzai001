name: Generate contribution snake
on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write
concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: tundzai001
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237C3AED&color_dots=%23F8FAFC,%23DBEAFE,%2393C5FD,%233B82F6,%231D4ED8
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23F97316&color_dots=%23111827,%231E293B,%230E7490,%2306B6D4,%23A5F3FC

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
